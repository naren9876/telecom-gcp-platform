# variables/dev.tfvars.yaml
# Development environment overrides
dev_environment:
  min_instances: 1
  max_instances: 10
  spanner_nodes: 2
  enable_backups: false
  log_retention_days: 7
  trace_sample_rate: 1.0
  log_level: "DEBUG"
  enable_cmek: false
  enable_profiling: true

  # Cost optimization for dev
  budget_monthly_limit: 500

  # Scaling for dev
  pubsub_max_delivery_attempts: 5

  # Monitoring (more verbose)
  enable_debug_logging: true
  monitoring_dashboard_refresh: "1m"

---

# variables/staging.tfvars.yaml
# Staging environment overrides (production-like)
staging_environment:
  min_instances: 2
  max_instances: 50
  spanner_nodes: 3
  enable_backups: true
  log_retention_days: 14
  trace_sample_rate: 0.5
  log_level: "INFO"
  enable_cmek: true
  enable_profiling: false

  # Cost management for staging
  budget_monthly_limit: 2000

  # Pub/Sub configuration
  pubsub_max_delivery_attempts: 10

  # Monitoring
  enable_debug_logging: false
  monitoring_dashboard_refresh: "5m"

---

# variables/production.tfvars.yaml
# Production environment overrides (maximum safety)
production_environment:
  min_instances: 3
  max_instances: 100
  spanner_nodes: 3  # Multi-region failover enabled
  spanner_multi_region: true
  enable_backups: true
  backup_schedule: "0 2 * * *"  # 2 AM UTC daily
  backup_retention_days: 30
  enable_pitr: true  # Point-in-time recovery
  log_retention_days: 30
  trace_sample_rate: 0.1
  log_level: "INFO"
  enable_cmek: true
  enable_profiling: false

  # Cost management for production
  budget_monthly_limit: 5000
  budget_alert_threshold: 0.9

  # Pub/Sub configuration
  pubsub_max_delivery_attempts: 20
  pubsub_dead_letter_policy_enabled: true

  # High availability
  enable_cloud_armor: true
  cloud_armor_rules_count: 10
  enable_cdn: true
  cdn_cache_mode: "CACHE_ALL_STATIC"

  # Security & Compliance
  enable_vpc_service_controls: true
  enable_cmek: true
  enable_audit_logs: true
  require_mfa: true

  # Monitoring
  enable_debug_logging: false
  monitoring_dashboard_refresh: "30s"
  alert_escalation_enabled: true
  enable_custom_metrics: true
